name: Copilot Project Automation

# Automatically updates GitHub Project board item statuses when:
#   1. An issue is assigned to the GitHub Copilot coding agent → moves to "Ready"
#   2. A pull request targeting `dev` is merged → moves linked issues to "Done"
#
# Prerequisites:
#   1. Create a GitHub Project (v2) that contains this repository's issues.
#   2. Add a repository variable named PROJECT_NUMBER with the project number
#      (visible in the project URL: /users/<owner>/projects/<number>).
#   3. Create a Personal Access Token with `project` and `repo` scopes and add
#      it as a repository secret named GH_TOKEN.

on:
  issues:
    types:
      - assigned
  pull_request:
    types:
      - closed
    branches:
      - dev
      - main

permissions:
  issues: read
  pull-requests: read

jobs:
  move-to-ready:
    name: Move issue to Ready when assigned to Copilot
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' &&
      (
        github.event.assignee.login == 'copilot' ||
        github.event.assignee.login == 'Copilot' ||
        contains(github.event.assignee.login, 'copilot')
      )
    steps:
      - name: Move issue to Ready in project
        uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);
            if (!projectNumber) {
              core.warning('PROJECT_NUMBER variable is not set. Skipping project automation.');
              return;
            }

            const owner = context.repo.owner;
            const issueNodeId = context.payload.issue.node_id;
            const issueNumber = context.payload.issue.number;

            // Query the project and its Status field options
            const projectQuery = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 30) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, number: projectNumber });

            const project = projectQuery.user?.projectV2;
            if (!project) {
              core.warning(`Project #${projectNumber} not found for user ${owner}.`);
              return;
            }

            const statusField = project.fields.nodes.find(
              f => f.name && f.name.toLowerCase() === 'status'
            );
            if (!statusField) {
              core.warning('Status field not found in project. Skipping.');
              return;
            }

            const readyOption = statusField.options.find(
              o => o.name.toLowerCase() === 'ready'
            );
            if (!readyOption) {
              core.warning('Ready option not found in Status field. Skipping.');
              return;
            }

            // Add the issue to the project (no-op if already present)
            const addResult = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }
            `, { projectId: project.id, contentId: issueNodeId });

            const itemId = addResult.addProjectV2ItemById.item.id;

            // Set the Status field to "Ready"
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: project.id,
              itemId,
              fieldId: statusField.id,
              optionId: readyOption.id,
            });

            core.info(`Issue #${issueNumber} moved to "Ready" in project #${projectNumber}.`);

  move-to-done:
    name: Move linked issues to Done when PR is merged to dev
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    steps:
      - name: Move linked issues to Done in project
        uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);
            if (!projectNumber) {
              core.warning('PROJECT_NUMBER variable is not set. Skipping project automation.');
              return;
            }

            const owner = context.repo.owner;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            // Extract issue numbers referenced by GitHub closing keywords in the PR body.
            // Matches: "closes #42", "fixes #7", "resolves https://github.com/org/repo/issues/7"
            const closingPattern =
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:#(\d+)|https?:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/(\d+))/gi;
            const issueNumbers = [];
            let match;
            while ((match = closingPattern.exec(prBody)) !== null) {
              const num = parseInt(match[1] || match[2]);
              if (!issueNumbers.includes(num)) {
                issueNumbers.push(num);
              }
            }

            if (issueNumbers.length === 0) {
              core.info(`PR #${prNumber} has no linked closing issues. Skipping.`);
              return;
            }

            // Query the project and its Status field options
            const projectQuery = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 30) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, number: projectNumber });

            const project = projectQuery.user?.projectV2;
            if (!project) {
              core.warning(`Project #${projectNumber} not found for user ${owner}.`);
              return;
            }

            const statusField = project.fields.nodes.find(
              f => f.name && f.name.toLowerCase() === 'status'
            );
            if (!statusField) {
              core.warning('Status field not found in project. Skipping.');
              return;
            }

            const doneOption = statusField.options.find(
              o => o.name.toLowerCase() === 'done'
            );
            if (!doneOption) {
              core.warning('Done option not found in Status field. Skipping.');
              return;
            }

            // Fetch all linked issues concurrently, then update each in the project
            const issueNodes = await Promise.all(
              issueNumbers.map(issueNumber =>
                github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                }).then(r => ({ issueNumber, nodeId: r.data.node_id }))
              )
            );

            for (const { issueNumber, nodeId: issueNodeId } of issueNodes) {

              // Add the issue to the project (no-op if already present)
              const addResult = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId: project.id, contentId: issueNodeId });

              const itemId = addResult.addProjectV2ItemById.item.id;

              // Set the Status field to "Done"
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: project.id,
                itemId,
                fieldId: statusField.id,
                optionId: doneOption.id,
              });

              core.info(`Issue #${issueNumber} moved to "Done" in project #${projectNumber}.`);
            }
