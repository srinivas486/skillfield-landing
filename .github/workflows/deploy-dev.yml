name: Deploy to GitHub Pages (Development)

# Deploys the dev branch to https://srinivas486.github.io/skillfield-landing-dev/
#
# Prerequisites:
#   1. Create a repository named "skillfield-landing-dev" under the srinivas486 account.
#   2. In that repo, enable GitHub Pages and set the source to the "gh-pages" branch.
#   3. Create a Personal Access Token (PAT) with "repo" scope and add it as a secret
#      named PAGES_DEPLOY_TOKEN in this repository's settings.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-dev"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NEXT_BASE_PATH: /skillfield-landing-dev

      - name: Verify PAGES_DEPLOY_TOKEN secret is configured
        run: |
          if [ -z "${{ secrets.PAGES_DEPLOY_TOKEN }}" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is not set. Please create a Personal Access Token with 'repo' scope and add it as PAGES_DEPLOY_TOKEN in this repository's secrets."
            exit 1
          fi

      - name: Deploy to skillfield-landing-dev repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: srinivas486/skillfield-landing-dev
          publish_branch: gh-pages
          publish_dir: ./out
